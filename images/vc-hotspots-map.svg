<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Global VC hotspots and cross-border risk callouts</title>
  <desc id="desc">Stylized world map with highlighted venture capital regions and notes on key cross-border risks.</desc>
  <rect width="960" height="520" fill="#f8fafc" />
  <rect x="40" y="80" width="250" height="140" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" />
  <rect x="320" y="90" width="200" height="130" rx="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2" />
  <rect x="560" y="90" width="300" height="160" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="2" />
  <rect x="120" y="280" width="220" height="140" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" />
  <rect x="420" y="300" width="180" height="120" rx="18" fill="#fee2e2" stroke="#ef4444" stroke-width="2" />
  <rect x="660" y="300" width="200" height="140" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2" />

  <circle cx="150" cy="130" r="12" fill="#1d4ed8" />
  <circle cx="210" cy="160" r="10" fill="#1d4ed8" />
  <circle cx="380" cy="140" r="12" fill="#0284c7" />
  <circle cx="610" cy="140" r="12" fill="#16a34a" />
  <circle cx="710" cy="160" r="10" fill="#16a34a" />
  <circle cx="190" cy="330" r="10" fill="#d97706" />
  <circle cx="470" cy="340" r="10" fill="#dc2626" />
  <circle cx="730" cy="350" r="10" fill="#7c3aed" />

  <text x="80" y="115" font-family="Arial, sans-serif" font-size="18" fill="#0f172a" font-weight="700">North America</text>
  <text x="340" y="125" font-family="Arial, sans-serif" font-size="18" fill="#0f172a" font-weight="700">Europe</text>
  <text x="585" y="125" font-family="Arial, sans-serif" font-size="18" fill="#0f172a" font-weight="700">Asia-Pacific</text>
  <text x="140" y="315" font-family="Arial, sans-serif" font-size="18" fill="#0f172a" font-weight="700">Latin America</text>
  <text x="455" y="325" font-family="Arial, sans-serif" font-size="18" fill="#0f172a" font-weight="700">Africa</text>
  <text x="690" y="325" font-family="Arial, sans-serif" font-size="18" fill="#0f172a" font-weight="700">MENA</text>

  <text x="80" y="145" font-family="Arial, sans-serif" font-size="14" fill="#1e3a8a">Hotspot: Bay Area, NYC</text>
  <text x="340" y="155" font-family="Arial, sans-serif" font-size="14" fill="#0e7490">Hotspot: London, Berlin</text>
  <text x="585" y="155" font-family="Arial, sans-serif" font-size="14" fill="#166534">Hotspot: Beijing, Singapore</text>
  <text x="140" y="345" font-family="Arial, sans-serif" font-size="14" fill="#b45309">Hotspot: São Paulo, Mexico City</text>
  <text x="455" y="355" font-family="Arial, sans-serif" font-size="14" fill="#991b1b">Hotspot: Lagos, Nairobi</text>
  <text x="690" y="355" font-family="Arial, sans-serif" font-size="14" fill="#5b21b6">Hotspot: Dubai, Riyadh</text>

  <rect x="60" y="420" width="840" height="70" rx="16" fill="#ffffff" stroke="#cbd5f5" stroke-width="2" />
  <text x="80" y="452" font-family="Arial, sans-serif" font-size="16" fill="#0f172a" font-weight="700">Key cross-border risks</text>
  <text x="80" y="474" font-family="Arial, sans-serif" font-size="14" fill="#334155">FX volatility • Regulatory variance • Exit liquidity gaps • Geopolitical shocks</text>
</svg>
