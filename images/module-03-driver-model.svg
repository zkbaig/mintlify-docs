<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title desc">
  <title id="title">Driver-based model diagram</title>
  <desc id="desc">Boxes for revenue drivers, cost drivers, and working capital feeding into financial statements and runway.</desc>
  <rect width="720" height="260" fill="#ffffff" />
  <g font-family="Arial, sans-serif" font-size="14" fill="#111827" stroke="#111827" stroke-width="1">
    <rect x="30" y="40" width="180" height="60" rx="8" fill="#e0f2fe" />
    <text x="50" y="70">Revenue drivers</text>
    <text x="50" y="90" font-size="12">Price × volume</text>

    <rect x="30" y="140" width="180" height="60" rx="8" fill="#fef3c7" />
    <text x="50" y="170">Cost drivers</text>
    <text x="50" y="190" font-size="12">COGS, headcount</text>

    <rect x="260" y="90" width="180" height="60" rx="8" fill="#ede9fe" />
    <text x="280" y="120">Working capital</text>
    <text x="280" y="140" font-size="12">Collections, payables</text>

    <rect x="500" y="40" width="190" height="70" rx="8" fill="#dcfce7" />
    <text x="520" y="70">Financial statements</text>
    <text x="520" y="90" font-size="12">Income, balance, cash</text>

    <rect x="500" y="150" width="190" height="60" rx="8" fill="#fee2e2" />
    <text x="520" y="180">Burn &amp; runway</text>
  </g>
  <g stroke="#111827" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="210" y1="70" x2="260" y2="120" />
    <line x1="210" y1="170" x2="260" y2="120" />
    <line x1="440" y1="120" x2="500" y2="75" />
    <line x1="440" y1="120" x2="500" y2="180" />
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#111827" />
    </marker>
  </defs>
</svg>
